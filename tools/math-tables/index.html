<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculia</title>
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=calculia-v33a007d2">
  <link rel="stylesheet" href="../../assets/css/base.css?v=calculia-v89f2211a">
  <link rel="stylesheet" href="../../assets/css/components.css?v=calculia-v62e5b2c5">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <a href="../../" class="back-link" data-i18n="core.back">← Volver</a>
    <header class="tool-header centered">
      <h1 data-i18n="title">🔢 Las Tablas</h1>
      <p id="instruction" data-i18n="instruction">Suma, multiplica, resta y divide con puntos de colores.</p>
      <p class="stars" id="stars">⭐ 0</p>
    </header>

    <main>
      <!-- Choose operation -->
      <section id="screenMenu" class="stack" aria-labelledby="menuTitle">
        <h2 id="menuTitle" data-i18n="chooseOperation">Elige qué quieres practicar.</h2>
        <div class="operation-grid" id="operationGrid"></div>
      </section>

      <!-- Choose table -->
      <section id="screenTables" class="stack hidden" aria-labelledby="tablesTitle">
        <h2 id="tablesTitle" data-i18n="chooseTable">Elige una tabla.</h2>
        <div class="table-grid" id="tableGrid"></div>
        <button type="button" class="btn btn-secondary" id="tablesBack" data-i18n="core.backToMenu">Volver al menú</button>
      </section>

      <!-- Learn the table -->
      <section id="screenLearn" class="stack hidden" aria-labelledby="learnTitle">
        <h2 id="learnTitle"></h2>
        <p id="learnInstruction" data-i18n="learnInstruction">Toca una row para verla con puntos.</p>
        <div class="learn-layout">
          <div class="fact-list" id="factList"></div>
          <div class="card visual-card" id="learnVisual" role="img"></div>
        </div>
        <button type="button" class="btn" id="startPractice" data-i18n="practiceTable">Practicar esta tabla</button>
        <button type="button" class="btn btn-secondary" id="learnBack" data-i18n="backToTables">← Elegir otra tabla</button>
      </section>

      <!-- Practice quiz -->
      <section id="screenQuiz" class="stack hidden" aria-live="polite">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
          <span class="progress-text" id="progressText">0 / 10</span>
        </div>
        <article class="card task-card stack">
          <h2 class="equation" id="quizPrompt"></h2>
          <div class="visual-card" id="quizVisual" role="img"></div>
          <!--
            Two answer shapes live here side by side:

              #options   — three shuffled buttons. Used by add / multiply
                          / subtract. The "more concrete" operations
                          where a glance at three numbers is enough to
                          pick the right one.

              #inputOption — a free-text number entry + a "check"
                          button. Used only by divide. Division has
                          no exact multiplication table of its own,
                          so the user has to compute the quotient
                          mentally and the remainder shows up in the
                          feedback, not in the answer box.
          -->
          <div class="option-row" id="options"></div>
          <div class="input-row hidden" id="inputOption">
            <label class="visually-hidden" for="divideInput" data-i18n="inputLabel">Escribe el resultado</label>
            <input type="number" id="divideInput" min="0" max="999" inputmode="numeric" autocomplete="off">
            <button type="button" class="btn" id="checkDivide" data-i18n="check">Comprobar</button>
          </div>
          <p class="feedback" id="feedback" aria-live="polite"></p>
          <!--
            restLine lives at feedback-time. When divide has a remainder
            (> 0), the feedback text is replaced with the explanation
            and the leftover count is shown here so the user sees both
            the "this is right" cue and the spare-dot explanation in
            the same view. Hidden in every other operation.
          -->
          <p class="rest-line hidden" id="restLine"></p>
          <p class="explanation hidden" id="explanation" aria-live="polite"></p>
          <button type="button" class="btn hidden" id="nextFact" data-i18n="core.next">Siguiente →</button>
        </article>
        <button type="button" class="btn btn-secondary" id="quizBack" data-i18n="backToTables">← Elegir otra tabla</button>
      </section>

      <!-- Round finished -->
      <section id="screenFinish" class="stack hidden centered">
        <div class="emoji-large" aria-hidden="true">🎉</div>
        <h2 data-i18n="core.roundComplete">¡Ronda completada!</h2>
        <p id="finishText"></p>
        <p id="transfer" class="transfer" data-i18n="transfer"></p>
      <button type="button" class="btn" id="endBackToStart" data-i18n="btnMenu">Volver al inicio</button>
    </section>
    </main>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js?v=calculia-v37f362d0"></script>
  <script src="../../assets/js/i18n.js?v=calculia-v3d393c12"></script>
  <script src="../../assets/js/storage.js?v=calculia-vd97e2550"></script>
  <script src="../../assets/js/feedback.js?v=calculia-v73bb9e8a"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="../../assets/js/sw-register.js?v=calculia-v58bd4f76"></script>
</body>
</html>
