<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculia</title>
    <link rel="stylesheet" href="../../assets/css/brand.css">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/locale-picker.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div data-suite-header data-suite-logo="../../assets/img/icono.svg" data-suite-byline></div>
    <div class="suite-chrome-activity" data-suite-activity>
      <a href="../../" class="back-link" data-i18n="core.back">Menú de Teclatlon</a>
      <h1 data-i18n="title">🔢 Las Tablas</h1>
    </div>
    <p class="stars" data-suite-stars id="stars">0 ⭐</p>


    <main class="suite-body">
      <!-- Choose table. The operation comes from the landing card (?op=add,
           multiply, subtract or divide), so there is no operation menu here. -->
      <section id="screenTables" class="stack hidden" aria-labelledby="tablesTitle">
        <div class="row center-row">
          <p class="instruction" id="instruction" data-i18n="instruction">Suma, multiplica, resta y divide con puntos de colores.</p>
        </div>
        <h2 id="tablesTitle" data-i18n="chooseTable">Elige una tabla.</h2>
        <div class="table-grid" id="tableGrid"></div>
      </section>

      <!-- Learn the table -->
      <section id="screenLearn" class="stack hidden" aria-labelledby="learnTitle">
        <h2 id="learnTitle"></h2>
        <p id="learnInstruction" data-i18n="learnInstruction">Toca el ❓ de una operación para ver cómo se cuenta con puntos.</p>
        <div class="learn-layout">
          <div class="fact-list" id="factList"></div>
          <div class="stack learn-demo hidden" id="learnDemo">
            <p class="demo-equation" id="demoEquation" aria-live="polite"></p>
            <div class="progress-bar" id="demoProgress" role="progressbar" aria-valuemin="0"><div class="progress-fill" id="demoProgressFill"></div></div>
            <div class="card visual-card" id="learnVisual" role="img"></div>
            <div class="carousel-controls">
              <button type="button" class="btn btn-secondary" id="demoPrev" data-i18n-aria="demoPrev" aria-label="Anterior">←</button>
              <button type="button" class="btn btn-secondary" id="demoNext" data-i18n-aria="demoNext" aria-label="Siguiente">→</button>
            </div>
            <button type="button" class="btn btn-secondary" id="demoBack" data-i18n="demoBack">← Volver a las tablas</button>
          </div>
        </div>
        <!-- Two practice cards: written or audio. Each card holds its two orders
             (in order, random). The module is chosen by data-channel and data-order (app.js). -->
        <div class="practice-modes" id="practiceModes">
          <section class="card practice-channel" role="group" aria-labelledby="channelWrittenName">
            <h3 class="practice-channel-name" id="channelWrittenName" data-i18n="channelWritten">Escrita</h3>
            <div class="practice-channel-buttons">
              <button type="button" class="btn" data-channel="written" data-order="sequential" data-i18n="modeSequential">En orden</button>
              <button type="button" class="btn" data-channel="written" data-order="random" data-i18n="modeRandom">Al azar</button>
            </div>
          </section>
          <section class="card practice-channel" role="group" aria-labelledby="channelAudioName">
            <h3 class="practice-channel-name" id="channelAudioName" data-i18n="channelAudio">Con audio</h3>
            <div class="practice-channel-buttons">
              <button type="button" class="btn" data-channel="audio" data-order="sequential" data-i18n="modeSequential">En orden</button>
              <button type="button" class="btn" data-channel="audio" data-order="random" data-i18n="modeRandom">Al azar</button>
            </div>
          </section>
        </div>
        <button type="button" class="btn btn-secondary" id="learnBack" data-i18n="backToTables">← Elegir otra tabla</button>
      </section>

      <!-- Practice quiz -->
      <section id="screenQuiz" class="stack hidden" aria-live="polite">
        <div class="progress-bar" data-suite-progress>
          <div class="progress-fill" id="progressFill"></div>
          <span class="progress-text" id="progressText">0 / 10</span>
        </div>
        <article class="card act-card--task stack">
          <h2 class="equation" id="quizPrompt"></h2>
          <button type="button" class="btn btn-secondary hidden" id="quizReplay" data-i18n="replayAudio">🔊 Escuchar otra vez</button>
          <div class="visual-card" id="quizVisual" role="img"></div>
          <!--
            Two answer shapes live here side by side:

              #options   — three shuffled buttons. Used by add / multiply
                          / subtract. The "more concrete" operations
                          where a glance at three numbers is enough to
                          pick the right one.

              #inputOption — a free-text number entry + a "check"
                          button. Used only by divide. Division has
                          no exact multiplication table of its own,
                          so the user has to compute the quotient
                          mentally and the remainder shows up in the
                          feedback, not in the answer box.
          -->
          <div class="option-row" id="options"></div>
          <div class="input-row hidden" id="inputOption">
            <label class="visually-hidden" for="divideInput" data-i18n="inputLabel">Escribe el resultado</label>
            <input type="number" id="divideInput" min="0" max="999" inputmode="numeric" autocomplete="off">
            <button type="button" class="btn" id="checkDivide" data-i18n="check">Comprobar</button>
          </div>
          <p class="feedback" id="feedback" aria-live="polite"></p>
          <!--
            restLine lives at feedback-time. When divide has a remainder
            (> 0), the feedback text is replaced with the explanation
            and the leftover count is shown here so the user sees both
            the "this is right" cue and the spare-dot explanation in
            the same view. Hidden in every other operation.
          -->
          <p class="rest-line hidden" id="restLine"></p>
          <p class="explanation hidden" id="explanation" aria-live="polite"></p>
          <button type="button" class="btn hidden" id="nextFact" data-i18n="core.next">Siguiente →</button>
        </article>
        <button type="button" class="btn btn-secondary" id="quizBack" data-i18n="backToTables">← Elegir otra tabla</button>
      </section>

      <!-- Round finished -->
    </main>
    <footer data-suite-footer data-suite-base="../../"></footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/achievements-engine.js"></script>
  <script src="../../assets/js/achievements.js"></script>
  <script src="../../assets/js/stars-engine.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="../../assets/js/tts.js"></script>
  <script src="../../assets/js/suite-chrome.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="visuals.js"></script>
  <script src="app.js"></script>
  <script src="../../assets/js/sw-register.js"></script>
  <script src="../../assets/js/locale-picker-config.js"></script>
  <script src="../../assets/js/locale-picker.js" defer></script>
</body>
</html>
