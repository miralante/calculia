<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle | Calculia</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🧩 Puzzle</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Start screen -->
    <section id="screenStart" class="stack centered">
      <div class="row center-row">
        <p class="instruction" id="instruction" data-i18n="instruction">Mira el modelo. Toca una pieza y después toca su sitio en el tablero.</p>
      </div>
      <h2 data-i18n="levelsTitle">Elige una actividad</h2>
      <div class="stack" id="levels"></div>
    </section>

    <!-- Game screen -->
    <section id="screenGame" class="hidden stack">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-text" id="progressText"></span>
      </div>

      <p class="image-title centered" id="titleImage"></p>

      <div class="zona-puzzle">
        <div class="bloque-modelo">
          <p class="etiqueta centered" data-i18n="modelLabel">Modelo</p>
          <div class="rejilla-puzzle modelo" id="model"></div>
        </div>
        <div class="bloque-tablero">
          <p class="etiqueta centered" data-i18n="boardLabel">Tu tablero</p>
          <div class="rejilla-puzzle" id="board"></div>
        </div>
      </div>

      <p class="etiqueta centered" data-i18n="piecesLabel">Piezas</p>
      <div class="stack-piezas" id="pieces"></div>

      <div class="feedback" id="feedback" aria-live="polite"></div>
      <button type="button" class="btn hidden" id="btnNext" data-i18n="core.next">Siguiente →</button>
    </section>

    <!-- End screen -->
    <section id="screenEnd" class="hidden centered stack" aria-live="polite">
      <div class="emoji-large" aria-hidden="true">🎉</div>
      <h2 data-i18n="core.roundComplete">¡Ronda completada!</h2>
      <p id="endSummary"></p>
      <p id="contexto" class="contexto"></p>
      <p id="explicacion" class="explicacion"></p>
      <p id="transfer" class="transfer" data-i18n="transferencia"></p>
      <button type="button" class="btn" id="btnRepeat" data-i18n="core.playAgain">Jugar otra vez</button>
      <button type="button" class="btn btn-secondary" id="btnOtherLevel" data-i18n="otherLevel">Elegir otra actividad</button>
      <a href="../../site/index.html" class="btn btn-secondary" data-i18n="core.backToMenu">Volver al menú</a>
    </section>
    <footer class="pie-app">
      <a href="../../legal/index.html" class="legal-link" data-i18n="core.dataProtection">Protección de datos</a>
    </footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/tts.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="../../assets/js/sw-register.js"></script>
</body>
</html>
