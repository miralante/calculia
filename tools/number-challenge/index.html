<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sube la escalera | Calculia</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=calculia-v33a007d2">
  <link rel="stylesheet" href="../../assets/css/base.css?v=calculia-v89f2211a">
  <link rel="stylesheet" href="../../assets/css/components.css?v=calculia-v62e5b2c5">
  <link rel="stylesheet" href="../../assets/css/number-sort.css?v=calculia-v05d6affe">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🪜 Sube la escalera</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Start: one card and one button. Nothing is timed. -->
    <section id="screenMenu" class="stack">
      <article class="card task-card">
        <h2 data-i18n="menuTitle">Sube la escalera</h2>
        <p class="task-detail" data-i18n="menuDetail">Cada respuesta acertada te sube un peldaño.</p>
        <button type="button" class="btn" id="btnStart" data-i18n="btnStart">Empezar</button>
      </article>
    </section>

    <!-- The game: the ladder, the streak, one question at a time. -->
    <section id="screenGame" class="hidden stack">
      <div class="ladder" id="ladder" role="group" data-i18n-aria="game.ladderAria" aria-label="Peldaños de la escalera"></div>
      <p class="streak" id="streak" aria-live="polite"></p>
      <div class="stack" id="question"></div>
      <button type="button" class="btn hidden" id="btnNext" data-i18n="game.next">Siguiente peldaño →</button>
    </section>

    <section id="screenEnd" class="hidden centered stack" aria-live="polite">
      <div class="emoji-large" aria-hidden="true">🏁</div>
      <h2 data-i18n="game.summaryTitle">¡Has llegado arriba!</h2>
      <p id="endSummary"></p>
      <p class="transfer" data-i18n="transfer"></p>
      <button type="button" class="btn" id="endBackToStart" data-i18n="game.endBack">Volver al inicio</button>
    </section>

    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js?v=calculia-v37f362d0"></script>
  <script src="../../assets/js/i18n.js?v=calculia-v3d393c12"></script>
  <script src="../../assets/js/storage.js?v=calculia-vd97e2550"></script>
  <script src="../../assets/js/feedback.js?v=calculia-v73bb9e8a"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="../../assets/js/number-sort.js?v=calculia-va8065aa0"></script>
  <script src="app.js"></script>
  <script src="../../assets/js/sw-register.js?v=calculia-v4a242865"></script>
</body>
</html>
