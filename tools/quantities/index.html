<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculia</title>
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=calculia-v33a007d2">
  <link rel="stylesheet" href="../../assets/css/base.css?v=calculia-v89f2211a">
  <link rel="stylesheet" href="../../assets/css/components.css?v=calculia-v62e5b2c5">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <a href="../../" class="back-link" data-i18n="core.back">← Volver</a>
    <header class="tool-header centered">
      <h1 data-i18n="title">👀 Leer y Escribir Números</h1>
      <div class="row center-row">
      <p id="instruction" data-i18n="instruction">Lee y escribe números grandes.</p>
      </div>
      <p class="stars" id="stars">⭐ 0</p>
    </header>

    <main>
      <!-- Menú principal: las tres prácticas (leer / escribir / poner los puntos).
           Es la ÚNICA pantalla sin "hidden" en el marcado: si app.js no llegara a pintarse,
           la persona ve el menú en vez de una página en blanco. app.js la elige igualmente en init(). -->
      <section id="screenMenu" class="stack" aria-labelledby="menuTitle">
        <h2 id="menuTitle" data-i18n="choosePractice">Elige qué quieres practicar.</h2>
        <div class="menu-grid" id="practiceGrid"></div>
      </section>


      <!-- ============ Prácticas ============
           Zonas por modo (todas viven aquí, app.js muestra/oculta
           según el modo):
             - #numberShown: número coloreado por posición (leer).
             - #pointsZone: juego de los puntos. #pointsBoard son las cifras
               con los huecos para tocar; #pointsTray son los puntos que
               quedan por colocar.
             - #answerInput: input de texto para leer/escribir.
             - #listenBtn: botón de audio (escribir). -->
      <section id="screenTask" class="stack hidden" aria-live="polite">
        <div class="progress-bar" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
        <p class="progress-text" id="progressText"></p>
        <article class="card task-card">
          <p class="task-icon" id="taskIcon" aria-hidden="true"></p>
          <h2 id="prompt"></h2>
          <p class="task-detail" id="taskDetail"></p>

          <div class="number-shown" id="numberShown" aria-live="polite"></div>

          <div class="points-zone hidden" id="pointsZone">
            <div class="points-row">
              <div class="points-board" id="pointsBoard" role="group" data-i18n-aria="pointsBoardAria" aria-label="Número para colocar los puntos"></div>
              <div class="points-tray" id="pointsTray" aria-hidden="true"></div>
            </div>
          </div>

          <button type="button" class="btn hidden" id="listenBtn" data-i18n="core.listen">🔊 Escuchar</button>

          <textarea id="answerInput" class="answer-input write-input hidden"
                 rows="5" maxlength="200" autocomplete="off" autocapitalize="off"
                 autocorrect="off" spellcheck="false"
                 data-i18n-aria="answerInputAria" aria-label="Escribe el número con letras"></textarea>

          <p class="feedback" id="feedback" aria-live="polite"></p>
          <button type="button" class="btn" id="checkAnswer" data-i18n="check">Comprobar</button>
          <button type="button" class="btn hidden" id="nextTask" data-i18n="core.next">Siguiente →</button>
        </article>
        <button type="button" class="btn btn-secondary" id="backToMenu" data-i18n="core.backToMenu">Volver al menú</button>
      </section>

      <section id="screenFinish" class="stack hidden centered">
        <h2 data-i18n="roundComplete">¡Ronda terminada!</h2>
        <p id="finishText"></p>
        <p id="contexto" class="contexto"></p>
        <p id="explanation" class="explanation"></p>
        <p class="transfer" id="transfer" data-i18n="transfer"></p>
      <button type="button" class="btn" id="endBackToStart" data-i18n="btnMenu">Volver al inicio</button>
    </section>
    </main>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js?v=calculia-v37f362d0"></script>
  <script src="../../assets/js/i18n.js?v=calculia-v3d393c12"></script>
  <script src="../../assets/js/tts.js?v=calculia-va9046a0d"></script>
  <script src="../../assets/js/storage.js?v=calculia-vd97e2550"></script>
  <script src="../../assets/js/feedback.js?v=calculia-v73bb9e8a"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
