<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Temperature | Calculia</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=calculia-vd99f158f">
  <link rel="stylesheet" href="../../assets/css/base.css?v=calculia-v89f2211a">
  <link rel="stylesheet" href="../../assets/css/components.css?v=calculia-v3badf010">
  <link rel="stylesheet" href="../../assets/css/locale-picker.css?v=calculia-vcdcf216d">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div data-suite-header></div>
    <header class="tool-header">
      <a href="../../" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🌡️ Temperatura del agua</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <section id="screenGame" class="hidden stack">
      <!-- The thermometer game. One order at a time: the order is the
           instruction to carry out, the live line says how far the
           target is, and the result is highlighted as an equation
           when the target is reached. -->
      <div id="thermoUI" class="stack">
        <div class="card centered stack thermo-order-card">
          <p class="thermo-order-count" id="thermoCount"></p>
          <p class="thermo-order" id="thermoOrder" aria-live="polite">
            <span class="thermo-order-arrow" aria-hidden="true"></span>
            <span class="thermo-order-text"></span>
          </p>
        </div>

        <div class="card centered stack thermo-card" id="thermoCard">
          <div class="thermo-visual">
            <div id="thermoState" class="thermo-state" aria-hidden="true">💧</div>
            <div id="thermoNumber" class="thermo-number" aria-live="polite"></div>
            <p class="thermo-state-label" id="thermoStateLabel"></p>
          </div>

          <!-- Number line from the lowest to the highest temperature of
               the level. The marker for the current temperature and the
               target move on every press; zero is drawn in the middle. -->
          <div class="thermo-track-wrap" aria-hidden="true">
            <div class="thermo-track" id="thermoTrack">
              <span class="thermo-track-ref" id="thermoZeroMark">0</span>
              <span class="thermo-track-ref" id="thermoHundredMark">100</span>
              <span class="thermo-mark thermo-mark-target" id="thermoTargetMark">🎯</span>
              <span class="thermo-mark thermo-mark-now" id="thermoNowMark">▲</span>
            </div>
          </div>
          <p class="thermo-target" id="thermoTargetText"></p>
          <p class="thermo-live" id="thermoLive" aria-live="polite"></p>
        </div>

        <!-- Shown when the target is reached: the result as an equation
             in large type, then what happened to the water. -->
        <div class="card centered stack thermo-result hidden" id="thermoResult" role="status">
          <p class="thermo-result-title" id="thermoResultTitle"></p>
          <p class="thermo-result-eq" id="thermoResultEq"></p>
          <p class="thermo-result-note" id="thermoResultNote"></p>
          <button type="button" class="btn" id="thermoNext"></button>
        </div>

        <div class="thermo-controls" id="thermoControls">
          <div class="thermo-row">
            <button type="button" class="btn-thermo" data-step="-10">−10</button>
            <button type="button" class="btn-thermo" data-step="-1">−1</button>
            <button type="button" class="btn-thermo btn-thermo-secondary" id="thermoReset">↺</button>
            <button type="button" class="btn-thermo" data-step="1">+1</button>
            <button type="button" class="btn-thermo" data-step="10">+10</button>
          </div>
          <button type="button" class="btn-thermo btn-thermo-exit" id="thermoExit">✅ Salir</button>
        </div>
        <p class="instruction thermo-hint" id="thermoHint"></p>
      </div>
    </section>

    <section id="screenEnd" class="stack hidden centered">
      <div class="emoji-large" aria-hidden="true">🎉</div>
      <h2 data-i18n="core.roundComplete">¡Ronda completada!</h2>
      <p id="endSummary"></p>
      <p id="contexto" class="contexto"></p>
      <p id="explanation" class="explanation"></p>
      <p id="transfer" class="transfer" data-i18n="transfer"></p>
      <button type="button" class="btn" id="endBackToStart" data-i18n="btnMenu">Volver al inicio</button>
    </section>
    <footer data-suite-footer data-suite-base="../../" data-suite-settings></footer>
  </div>

  <script src="../../assets/js/utils.js?v=calculia-va7e749b4"></script>
  <script src="../../assets/js/i18n.js?v=calculia-v98ee3091"></script>
  <script src="../../assets/js/storage.js?v=calculia-v8a6191e2"></script>
  <script src="../../assets/js/achievements-engine.js?v=calculia-v53655f03"></script>
  <script src="../../assets/js/achievements.js?v=calculia-v225532f6"></script>
  <script src="../../assets/js/stars-engine.js?v=calculia-v8d4a7ee6"></script>
  <script src="../../assets/js/feedback.js?v=calculia-v58ce92ca"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="../../assets/js/activity-glue.js?v=calculia-v2e0bae7b"></script>
  <script src="app.js"></script>
  <script src="../../assets/js/sw-register.js?v=calculia-v4a242865"></script>
  <script src="../../assets/js/locale-picker-config.js?v=calculia-v3be3c240"></script>
  <script src="../../assets/js/locale-picker.js?v=calculia-v8851c7df" defer></script>
  <script src="../../assets/js/suite-chrome.js?v=calculia-v40aa8123"></script>
</body>
</html>
