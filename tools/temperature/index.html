<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Temperature | Calculia</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🌡️ Temperatura del agua</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <section id="screenMenu" class="stack">
      <div class="row center-row">
        <p class="instruction" id="instruction" data-i18n="instructionMenu">Aprende qué pasa con el agua cuando cambia la temperatura.</p>
      </div>
      <div id="activitiesMenu"></div>
      <p class="extra-note" id="noteExtra"></p>
    </section>

    <section id="screenLevels" class="hidden stack">
      <h2 id="activityTitle"></h2>
      <div class="row center-row">
        <p class="instruction" id="activityInstruction"></p>
      </div>
      <div class="stack" id="levels"></div>
      <button type="button" class="btn btn-secondary" id="btnBackToMenu" data-i18n="btnBackToMenu">← Otras actividades</button>
    </section>

    <section id="screenGame" class="hidden stack">
      <!-- The quiz card / progress bar / options belong to the
           classic quiz flow; they stay in the DOM but are hidden
           when a temperature mission is active (free-exploration
           mode, no question to ask). The thermometer UI replaces
           them visually. -->
      <div class="progress-bar hidden" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-text" id="progressText">0 / 6</span>
      </div>

      <div class="card centered stack hidden" id="quizCard">
        <p class="prompt" id="prompt"></p>
        <div class="visual" id="visual"></div>
        <p class="legend hidden" id="legend"></p>
      </div>

      <div class="stack options hidden" id="options"></div>

      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="row explanation hidden" id="explanationWrap">
        <p id="explanation" aria-live="polite"></p>
      </div>
      <button type="button" class="btn hidden" id="btnNext" data-i18n="core.next">Siguiente →</button>

      <!-- Thermometer + water visual + controls. Visible whenever
           a temperature mission level is active (tipo
           'misionEstado' or 'misionExacta'). The big number IS the
           current temperature; the emoji below it shows the
           physical state (ice / liquid / steam). -->
      <div id="thermoUI" class="hidden stack">
        <div class="card centered thermo-card">
          <p class="thermo-goal" id="thermoGoal"></p>
          <div class="thermo-visual">
            <div id="thermoState" class="thermo-state" aria-hidden="true">💧</div>
            <div id="thermoNumber" class="thermo-number" aria-live="polite"></div>
            <p class="thermo-state-label" id="thermoStateLabel"></p>
          </div>
        </div>
        <div class="thermo-controls">
          <div class="thermo-row">
            <button type="button" class="btn-thermo" data-step="-10">−10</button>
            <button type="button" class="btn-thermo" data-step="-1">−1</button>
            <button type="button" class="btn-thermo btn-thermo-icon" id="thermoAudio" aria-label="Hear the temperature">🔊</button>
            <button type="button" class="btn-thermo btn-thermo-secondary" id="thermoReset">↺ 0</button>
            <button type="button" class="btn-thermo" data-step="1">+1</button>
            <button type="button" class="btn-thermo" data-step="10">+10</button>
            <button type="button" class="btn-thermo" id="thermoExit">✅ Salir</button>
          </div>
        </div>
        <p class="instruction thermo-hint" id="thermoHint" data-i18n="gen.hint"></p>
      </div>
    </section>

    <section id="screenEnd" class="hidden centered stack" aria-live="polite">
      <div class="emoji-large" aria-hidden="true">🎉</div>
      <h2 data-i18n="core.roundComplete">¡Ronda completada!</h2>
      <p id="endSummary"></p>
      <p id="transfer" class="transfer" data-i18n="explicacion"></p>
      <button type="button" class="btn btn-secondary hidden" id="btnHarder"></button>
      <button type="button" class="btn" id="btnRepeat" data-i18n="core.playAgain">Jugar otra vez</button>
      <button type="button" class="btn btn-secondary" id="btnOtherLevel" data-i18n="otherLevel">Elegir otro nivel</button>
      <button type="button" class="btn btn-secondary" id="btnOtherActivity" data-i18n="btnOtherActivity">Otra actividad</button>
      <a href="../../site/index.html" class="btn btn-secondary" data-i18n="core.backToMenu">Volver al menú</a>
    </section>
    <footer class="pie-app">
      <a href="../../legal/index.html" class="legal-link" data-i18n="core.dataProtection">Protección de datos</a>
    </footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/tts.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="../../assets/js/sw-register.js"></script>
</body>
</html>
