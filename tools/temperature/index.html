<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Temperature | Calculia</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=calculia-vd99f158f">
  <link rel="stylesheet" href="../../assets/css/base.css?v=calculia-v89f2211a">
  <link rel="stylesheet" href="../../assets/css/components.css?v=calculia-v3badf010">
  <link rel="stylesheet" href="../../assets/css/locale-picker.css?v=calculia-vcdcf216d">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div data-suite-header></div>
    <header class="tool-header">
      <a href="../../" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🌡️ Temperatura del agua</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>


    

    <section id="screenGame" class="hidden stack">
      <!-- The quiz card / progress bar / options belong to the
           classic quiz flow; they stay in the DOM but are hidden
           when a temperature mission is active (free-exploration
           mode, no question to ask). The thermometer UI replaces
           them visually. -->
      <div class="progress-bar hidden" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-text" id="progressText">0 / 6</span>
        <span class="difficulty" id="difficulty"></span>
      </div>

      <div class="card centered stack hidden" id="quizCard">
        <p class="prompt" id="prompt"></p>
        <div class="visual" id="visual"></div>
        <p class="legend hidden" id="legend"></p>
      </div>

      <div class="stack options hidden" id="options"></div>

      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="row explanation hidden" id="explanationWrap">
        <p id="explanation" aria-live="polite"></p>
      </div>
      <button type="button" class="btn hidden" id="btnNext" data-i18n="core.next">Siguiente →</button>

      <!-- Thermometer + water visual + controls. Visible whenever
           a temperature mission level is active (tipo
           'misionEstado' or 'misionExacta'). The big number IS the
           current temperature; the emoji below it shows the
           physical state (ice / liquid / steam). -->
      <div id="thermoUI" class="hidden stack">
        <div class="card centered thermo-card">
          <p class="thermo-goal" id="thermoGoal"></p>
          <div class="thermo-visual">
            <div id="thermoState" class="thermo-state" aria-hidden="true">💧</div>
            <div id="thermoNumber" class="thermo-number" aria-live="polite"></div>
            <p class="thermo-state-label" id="thermoStateLabel"></p>
          </div>
        </div>
        <!-- Random exploration suggestion. Refreshed every time
             render() runs (entry, reset, "play again"). Not a goal:
             it's just a starting idea so the user doesn't have to
             pick a temperature themselves. Hidden when the chosen
             value is the same as the starting temperature (no
             point showing "stay where you are"). -->
        <p class="thermo-suggestion hidden" id="thermoSuggestion" aria-live="polite"></p>
        <div class="thermo-controls">
          <div class="thermo-row">
            <button type="button" class="btn-thermo" data-step="-10">−10</button>
            <button type="button" class="btn-thermo" data-step="-1">−1</button>
            <button type="button" class="btn-thermo btn-thermo-icon" id="thermoAudio" aria-label="Hear the temperature">🔊</button>
            <button type="button" class="btn-thermo btn-thermo-secondary" id="thermoReset">↺ 0</button>
            <button type="button" class="btn-thermo" data-step="1">+1</button>
            <button type="button" class="btn-thermo" data-step="10">+10</button>
            <button type="button" class="btn-thermo" id="thermoExit">✅ Salir</button>
          </div>
        </div>
        <p class="instruction thermo-hint" id="thermoHint" data-i18n="gen.hint"></p>
      </div>
    </section>

    <section id="screenEnd" class="stack hidden centered">
      <div class="emoji-large" aria-hidden="true">🎉</div>
      <h2 data-i18n="core.roundComplete">¡Ronda completada!</h2>
      <p id="endSummary"></p>
      <p id="contexto" class="contexto"></p>
      <p id="explanation" class="explanation"></p>
      <p id="transfer" class="transfer" data-i18n="transfer"></p>
      <button type="button" class="btn" id="endBackToStart" data-i18n="btnMenu">Volver al inicio</button>
    </section>
    <footer data-suite-footer data-suite-base="../../" data-suite-settings></footer>
  </div>

  <script src="../../assets/js/utils.js?v=calculia-va7e749b4"></script>
  <script src="../../assets/js/i18n.js?v=calculia-v98ee3091"></script>
  <script src="../../assets/js/storage.js?v=calculia-v8a6191e2"></script>
  <script src="../../assets/js/achievements-engine.js?v=calculia-v53655f03"></script>
  <script src="../../assets/js/achievements.js?v=calculia-v225532f6"></script>
  <script src="../../assets/js/stars-engine.js?v=calculia-v8d4a7ee6"></script>
  <script src="../../assets/js/feedback.js?v=calculia-v58ce92ca"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="../../assets/js/activity-glue.js?v=calculia-v2e0bae7b"></script>
  <script src="app.js"></script>
  <script src="../../assets/js/sw-register.js?v=calculia-v4a242865"></script>
  <script src="../../assets/js/locale-picker-config.js?v=calculia-v3be3c240"></script>
  <script src="../../assets/js/locale-picker.js?v=calculia-v8851c7df" defer></script>
  <script src="../../assets/js/suite-chrome.js?v=calculia-v40aa8123"></script>
</body>
</html>
