<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sube y baja | Calculia</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/brand.css?v=calculia-v66e94ecb">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=calculia-vd99f158f">
  <link rel="stylesheet" href="../../assets/css/base.css?v=calculia-v89f2211a">
  <link rel="stylesheet" href="../../assets/css/components.css?v=calculia-vdf1675e4">
  <link rel="stylesheet" href="../../assets/css/locale-picker.css?v=calculia-v29c29c27">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div data-suite-header data-suite-logo="../../assets/img/icono.svg?v=calculia-v8587a7e0" data-suite-byline></div>
    <div class="suite-chrome-activity" data-suite-activity>
      <a href="../numbers-group/" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🛗 Sube y baja</h1>
    </div>
    <main class="suite-body">
    <span class="stars" data-suite-stars id="stars">⭐ 0</span>

    <!-- Menu: the two games. Each card opens one game on the shared board. -->
    <section id="screenMenu" class="stack">
      <p class="card centered menu-intro" data-i18n="menu.intro"></p>

      <div class="stage-grid">
        <button type="button" class="stage-card" data-stage="elevator">
          <span class="stage-icon" aria-hidden="true">🛗</span>
          <span class="stage-name" data-i18n="elev.name">Ascensor</span>
          <span class="stage-detail" data-i18n="elev.detail"></span>
        </button>

        <button type="button" class="stage-card" data-stage="water">
          <span class="stage-icon" aria-hidden="true">🌡️</span>
          <span class="stage-name" data-i18n="water.name">Termómetro del agua</span>
          <span class="stage-detail" data-i18n="water.detail"></span>
        </button>
      </div>
    </section>

    <!-- Play: one board for both games. app.js sets the scale, the steps and the texts. -->
    <section id="screenPlay" class="hidden stack">
      <!-- The shared progress bar: suite-chrome.js moves it under the header. -->
      <div class="progress-bar" data-suite-progress>
        <div class="progress-fill" data-role="progress-fill"></div>
      </div>

      <p class="play-stage" data-role="stage"></p>

      <div class="card centered stack order-card">
        <p class="order" aria-live="polite">
          <span class="order-arrow" data-role="order-arrow" aria-hidden="true"></span>
          <span data-role="order-text"></span>
        </p>
      </div>

      <div class="card board" data-role="board">
        <div class="scale" data-role="scale"></div>

        <div class="readout">
          <p class="readout-value" data-role="value" aria-live="polite"></p>
          <p class="readout-label" data-role="value-label"></p>
          <p class="live" data-role="live" aria-live="polite"></p>
        </div>
      </div>

      <!-- Shown when the target is reached: the value, then what happened. -->
      <div class="card centered stack play-result hidden" data-role="result" role="status">
        <p class="play-result-title" data-role="result-title"></p>
        <p class="play-result-value" data-role="result-value"></p>
        <p class="play-result-note" data-role="result-note"></p>
        <button type="button" class="btn" data-role="next"></button>
      </div>

      <div class="play-controls" data-role="controls">
        <div class="step-row" data-role="steps"></div>
        <div class="play-actions">
          <button type="button" class="btn btn-secondary" data-role="reset" data-i18n="game.btnReset">↺ Empezar la orden de nuevo</button>
          <button type="button" class="btn btn-secondary" data-role="exit" data-i18n="game.btnExit">✅ Salir al menú</button>
        </div>
      </div>
    </section>

    </main>
    <footer data-suite-footer data-suite-base="../../" data-suite-settings></footer>
  </div>

  <script src="../../assets/js/utils.js?v=calculia-v0d2f78bc"></script>
  <script src="../../assets/js/i18n.js?v=calculia-v0044cbfa"></script>
  <script src="../../assets/js/storage.js?v=calculia-v8a6191e2"></script>
  <script src="../../assets/js/achievements-engine.js?v=calculia-v53655f03"></script>
  <script src="../../assets/js/achievements.js?v=calculia-v225532f6"></script>
  <script src="../../assets/js/stars-engine.js?v=calculia-vef47fec2"></script>
  <script src="../../assets/js/feedback.js?v=calculia-v5c6f33a8"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="../../assets/js/activity-glue.js?v=calculia-v6c16a00d"></script>
  <script src="app.js"></script>
  <script src="../../assets/js/sw-register.js?v=calculia-v4a242865"></script>
  <script src="../../assets/js/locale-picker-config.js?v=calculia-v3be3c240"></script>
  <script src="../../assets/js/locale-picker.js?v=calculia-v8851c7df" defer></script>
  <script src="../../assets/js/suite-chrome.js?v=calculia-ve3cd47ff"></script>
</body>
</html>
