<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Problemas de multiplicar | Calculia</title>
  <meta name="theme-color" content="#FAF7F2">
    <link rel="stylesheet" href="../../assets/css/brand.css">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/locale-picker.css">
  <link rel="stylesheet" href="../../assets/css/word-problems.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div data-suite-header data-suite-logo="../../assets/img/icono.svg" data-suite-byline></div>
    <div class="suite-chrome-activity" data-suite-activity>
      <a href="../../" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">Problemas de multiplicar</h1>
    </div>
    <main class="suite-body">
    <span class="stars" data-suite-stars id="stars">0 ⭐</span>

    <section id="screenGame" class="stack">
      <div class="row center-row">
        <p class="instruction" data-i18n="instruction">Lee el problema y elige la respuesta.</p>
      </div>
      <div class="progress-bar" data-suite-progress id="progressBar" role="progressbar" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div>
      <article class="card problem-card">
        <div class="problem-icon" id="problemIcon" aria-hidden="true"></div>
        <p class="problem-statement" id="statement"></p>
        <div class="problem-options" id="options"></div>
        <p class="feedback hidden" id="feedback" aria-live="polite"></p>
      </article>
      <div class="row sheet-actions">
        <button type="button" class="btn hidden" id="btnNext" data-i18n="next">Siguiente →</button>
      </div>
    </section>


    </main>
    <footer data-suite-footer data-suite-base="../../"></footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/achievements-engine.js"></script>
  <script src="../../assets/js/achievements.js"></script>
  <script src="../../assets/js/stars-engine.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="../../assets/js/suite-chrome.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="../../assets/js/word-problems.js"></script>
  <script src="app.js"></script>
  <script src="../../assets/js/sw-register.js"></script>
  <script src="../../assets/js/locale-picker-config.js"></script>
  <script src="../../assets/js/locale-picker.js" defer></script>
</body>
</html>
