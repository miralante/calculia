<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trigonometría | Calculia</title>
  <meta name="theme-color" content="#FAF7F2">
    <link rel="stylesheet" href="../../assets/css/brand.css">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/locale-picker.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div data-suite-header data-suite-logo="../../assets/img/icono.svg" data-suite-byline></div>
    <div class="suite-chrome-activity" data-suite-activity>
      <a href="../../" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">⛰️ Trigonometría</h1>
    </div>
    <main class="suite-body">
    <span class="stars" data-suite-stars id="stars">⭐ 0</span>

    <section id="screenLearn" class="stack">
      <div class="card centered stack lesson-card">
        <h2 id="learnTitle"></h2>
        <p class="instruction" id="learnContext"></p>
        <div class="visual lesson-visual" id="learnVisual"></div>
        <p class="lesson-rule" id="learnRule"></p>
        <div class="visual lesson-visual" id="learnRampVisual"></div>
        <p class="lesson-rule" id="learnRampRule"></p>
      </div>
      <button type="button" class="btn btn-secondary" id="btnRealExamples"></button>
      <button type="button" class="btn" id="btnStartLesson"></button>
    </section>

    <section id="screenReal" class="hidden stack">
      <div class="row center-row">
        <p class="instruction" data-i18n="realTitle">La trigonometría en la vida real</p>
      </div>
      <div class="card centered stack real-card">
        <div class="real-visual" id="realVisual"></div>
        <ol class="real-caption" id="realCaption" aria-live="polite"></ol>
        <div class="carousel-controls">
          <button type="button" class="btn btn-secondary" id="realPrev">←</button>
          <button type="button" class="btn btn-secondary" id="realNext">→</button>
        </div>
      </div>
      <div class="row intro-buttons">
        <button type="button" class="btn" id="realContinue"></button>
      </div>
    </section>

    <section id="screenGame" class="hidden stack">
      <div class="progress-bar" data-suite-progress>
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-text" id="progressText">0 / 6</span>
        <span class="difficulty" id="difficulty"></span>
      </div>

      <button type="button" class="btn btn-secondary btn-reference" id="btnReference" data-i18n="btnReference">Ver el ejemplo</button>

      <div class="card centered stack">
        <p class="prompt" id="prompt"></p>
        <div class="visual" id="visual"></div>
        <p class="legend hidden" id="legend"></p>
      </div>

      <div class="stack options" id="options"></div>

      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="row explanation hidden" id="explanationWrap">
        <p id="explanation" aria-live="polite"></p>
      </div>
      <button type="button" class="btn hidden" id="btnNext" data-i18n="core.next">Siguiente →</button>
    </section>

    </main>
    <footer data-suite-footer data-suite-base="../../" data-suite-settings></footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/achievements-engine.js"></script>
  <script src="../../assets/js/achievements.js"></script>
  <script src="../../assets/js/stars-engine.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="figures.js"></script>
  <script src="questions.js"></script>
  <script src="../../assets/js/activity-glue.js"></script>
  <script src="../../assets/js/classic-quiz.js"></script>
  <script src="app.js"></script>
  <script src="../../assets/js/sw-register.js"></script>
  <script src="../../assets/js/locale-picker-config.js"></script>
  <script src="../../assets/js/locale-picker.js" defer></script>
  <script src="../../assets/js/suite-chrome.js"></script>
</body>
</html>
