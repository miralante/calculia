<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Los Números | Calculia</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=calculia-v33a007d2">
  <link rel="stylesheet" href="../../assets/css/base.css?v=calculia-v89f2211a">
  <link rel="stylesheet" href="../../assets/css/components.css?v=calculia-vdb9f1392">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="titleH1">🔢 Los Números</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Galería única: 7 slides seguidas, sin secciones separadas.
         Mismo flujo que Formas: una sola card visible, ← / → para
         cambiar. El último slide muestra el botón "Terminar". -->
    <section id="screenGallery" class="stack">
      <div class="row center-row">
        <p class="instruction" data-i18n="galleryIntro">Mira y pasa las tarjetas.</p>
      </div>
      <div class="card slide-card">
        <h2 class="slide-title" id="slideTitle"></h2>
        <!-- Eyebrow above the list of real-life examples. Visible
             only on the "real" cards (kind: 'real'); hidden on
             exposition and comparison cards. -->
        <p class="slide-eyebrow hidden" id="slideEyebrow" data-i18n="realEyebrow"></p>
        <div class="slide-visual" id="slideVisual" role="img" aria-hidden="true"></div>
        <!-- Real-life examples rendered as a list on "real" cards;
             hidden on exposition and comparison cards. Items come
             from strings.<id>Real, split on ' · '. -->
        <ul class="slide-real hidden" id="slideReal"></ul>
      </div>
      <div class="carousel-controls">
        <button type="button" class="btn btn-secondary" id="slidePrev" aria-label="Anterior">←</button>
        <span class="slide-counter" id="slideCounter">1 / 7</span>
        <button type="button" class="btn btn-secondary" id="slideNext" aria-label="Siguiente">→</button>
      </div>
      <button type="button" class="btn hidden" id="slideFinish" data-i18n="finish">Terminar →</button>
    </section>

    <!-- Cierre: sin test. +1 estrella por completar la actividad
         una vez en la sesión; los siguientes "Ver otra vez" ya
         no suman. -->
    <section id="screenEnd" class="stack hidden centered">
      <div class="emoji-large" aria-hidden="true">🎉</div>
      <h2 data-i18n="endTitle">¡Has terminado!</h2>
      <p id="endSummary"></p>
      <p id="transfer" class="transfer" data-i18n="transfer">Esto te servirá para saber qué tipo de número tienes delante.</p>
      <button type="button" class="btn" id="endBackToStart" data-i18n="btnMenu">Volver al inicio</button>
    </section>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js?v=calculia-v4a0c88f5"></script>
  <script src="../../assets/js/i18n.js?v=calculia-v612d54ba"></script>
  <script src="../../assets/js/storage.js?v=calculia-vaa34f830"></script>
  <script src="../../assets/js/achievements.js?v=calculia-v24e909e3"></script>
  <script src="../../assets/js/feedback.js?v=calculia-vd06b628a"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="../../assets/js/sw-register.js?v=calculia-v4a242865"></script>
</body>
</html>
