<body>
  <div class="container">
    <div data-suite-header data-suite-logo="../../assets/img/icono.svg?v=calculia-v8587a7e0" data-suite-byline></div>
    <div class="suite-chrome-activity" data-suite-activity>
      <a href="../../" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">➗ Cuentas rápidas</h1>
    </div>
    <main class="suite-body">
    <span class="stars" data-suite-stars id="stars">⭐ 0</span>

    <section id="screenMenu" class="stack">
      <div class="row center-row">
        <p class="instruction" id="instruction" data-i18n="instructionMenu">Elige una actividad.</p>
      </div>
      <div id="activitiesMenu"></div>
    </section>

    

    <section id="screenGame" class="hidden stack">
      <div class="progress-bar" data-suite-progress>
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-text" id="progressText">0 / 6</span>
        <span class="difficulty" id="difficulty"></span>
      </div>

      <div class="card centered stack">
        <p class="prompt" id="prompt"></p>
        <div class="visual" id="visual"></div>
        <p class="legend hidden" id="legend"></p>
      </div>

      <div class="stack options" id="options"></div>

      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="row explanation hidden" id="explanationWrap">
        <p id="explanation" aria-live="polite"></p>
      </div>
      <button type="button" class="btn hidden" id="btnNext" data-i18n="core.next">Siguiente →</button>
    </section>

    <!-- Explanation + real-life screens of «Cuentas rápidas de los números»
         (placevalue). Painted from strings keyed by the sub-activity id
         (assets/js/expo-screens.js). -->
    <section id="expoScreen" class="hidden stack" aria-labelledby="expoTitleEl">
      <div class="row center-row">
        <p class="instruction" id="expoInstructionEl" data-i18n="instructionMenu"></p>
      </div>
      <div class="card centered stack expo-lesson-card">
        <h2 id="expoTitleEl"></h2>
        <div class="expo-lesson">
          <p id="expoIntroEl"></p>
          <ul id="expoBulletsEl"></ul>
        </div>
        <p class="expo-note" id="expoNoteEl"></p>
      </div>
      <p class="instruction hidden" id="expoProgressEl" aria-live="polite"></p>
      <div class="row lesson-actions">
        <button type="button" class="btn btn-secondary hidden" id="expoBack" data-i18n="expoBack"></button>
        <button type="button" class="btn" id="expoNext" data-i18n="expoNext"></button>
      </div>
    </section>

    <section id="realScreen" class="hidden stack" aria-labelledby="realTitleEl">
      <div class="row center-row">
        <p class="instruction" id="realInstructionEl" data-i18n="instructionMenu"></p>
      </div>
      <div class="card centered stack expo-lesson-card">
        <h2 id="realTitleEl"></h2>
        <div class="real-list" id="realListEl"></div>
      </div>
      <div class="row lesson-actions">
        <button type="button" class="btn btn-secondary" id="realBack" data-i18n="realBack"></button>
        <button type="button" class="btn" id="realNext" data-i18n="realNext"></button>
      </div>
    </section>

    </main>
    <footer data-suite-footer data-suite-base="../../" data-suite-settings></footer>
  </div>
