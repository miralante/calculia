<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temporizador | Calculia</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=calculia-vd99f158f">
  <link rel="stylesheet" href="../../assets/css/base.css?v=calculia-v89f2211a">
  <link rel="stylesheet" href="../../assets/css/components.css?v=calculia-v3badf010">
  <link rel="stylesheet" href="../../assets/css/locale-picker.css?v=calculia-vcdcf216d">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div data-suite-header></div>
    <header class="tool-header">
      <a href="../time-group/" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">⏲️ Temporizador</h1>
    </header>

    <!-- Choose the time. Each button starts the count. -->
    <section id="screenPick" class="stack">
      <div class="row center-row">
        <p class="instruction" data-i18n="instruction">Elige cuánto tiempo quieres medir.</p>
      </div>
      <div class="timer-choices" id="choices"></div>
    </section>

    <!-- The count, from 00:00 up to the chosen time. It waits at 00:00 until
         the person presses Empezar. -->
    <section id="screenRun" class="hidden stack">
      <div class="card centered stack timer-card">
        <p class="timer-goal" id="goal"></p>
        <p class="timer-time" id="elapsed" role="timer">00:00</p>
        <div class="progress-bar timer-bar" id="timerBar" role="progressbar" data-i18n-aria="elapsedLabel" aria-label="Tiempo pasado" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-fill" id="timerFill"></div>
        </div>
      </div>

      <div class="row sheet-actions">
        <button type="button" class="btn" id="btnStart" data-i18n="start">Empezar</button>
        <button type="button" class="btn btn-secondary hidden" id="btnPause" data-i18n="pause">Pausar</button>
        <button type="button" class="btn btn-secondary" id="btnStop" data-i18n="stop">Parar</button>
      </div>

      <!-- Shown when the time is up. Tabindex -1 lets the script move the
           focus here, so a screen reader announces it. -->
      <div class="card centered stack timer-alarm hidden" id="alarm" role="alert" tabindex="-1">
        <div class="timer-alarm-icon" aria-hidden="true">⏰</div>
        <h2 class="timer-alarm-title" data-i18n="alarmTitle">¡Se acabó el tiempo!</h2>
        <p class="timer-alarm-text" id="alarmText"></p>
        <button type="button" class="btn btn-secondary" id="btnSilence" data-i18n="silence">Parar el aviso</button>
        <button type="button" class="btn" id="btnAgain" data-i18n="again">Medir otro tiempo</button>
      </div>
    </section>

    <footer data-suite-footer data-suite-base="../../" data-suite-settings></footer>
  </div>

  <script src="../../assets/js/utils.js?v=calculia-va7e749b4"></script>
  <script src="../../assets/js/i18n.js?v=calculia-v98ee3091"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="../../assets/js/sw-register.js?v=calculia-v4a242865"></script>
  <script src="../../assets/js/locale-picker-config.js?v=calculia-v3be3c240"></script>
  <script src="../../assets/js/locale-picker.js?v=calculia-v8851c7df" defer></script>
  <script src="../../assets/js/suite-chrome.js?v=calculia-v40aa8123"></script>
</body>
</html>
