<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unidades de tiempo | Calculia</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=calculia-v33a007d2">
  <link rel="stylesheet" href="../../assets/css/base.css?v=calculia-v89f2211a">
  <link rel="stylesheet" href="../../assets/css/components.css?v=calculia-v2a2b6135">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../time-group/" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">⌛ Unidades de tiempo</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Pantalla 1: la explicación. Una tarjeta por unidad, del siglo al
         segundo. Se recorre con el carrusel. -->
    <section id="screenIntro" class="stack">
      <div class="row center-row">
        <p class="instruction" data-i18n="instructionIntro">Lee la explicación.</p>
      </div>
      <div class="card stack carousel-card">
        <div class="carousel-display" id="carouselDisplay" role="button" tabindex="0"></div>
        <div class="carousel-controls">
          <button type="button" class="btn btn-secondary" id="carouselPrev" data-i18n="prev">←</button>
          <button type="button" class="btn btn-secondary" id="carouselNext" data-i18n="nextArrow">→</button>
        </div>
      </div>
      <div class="row intro-buttons">
        <button type="button" class="btn btn-secondary" id="introNext" data-i18n="introNext">Ver en la vida real →</button>
      </div>
    </section>

    <!-- Pantalla 2: ejemplos de la vida real, con la misma unidad de la
         explicación. Se recorre con su propio carrusel. -->
    <section id="screenExamples" class="hidden stack">
      <div class="row center-row">
        <p class="instruction" data-i18n="instructionExamples">Mira cómo aparece en la vida real.</p>
      </div>
      <div class="card stack carousel-card">
        <div class="carousel-display" id="exampleDisplay" role="button" tabindex="0"></div>
        <div class="carousel-controls">
          <button type="button" class="btn btn-secondary" id="examplePrev" data-i18n="prev">←</button>
          <button type="button" class="btn btn-secondary" id="exampleNext" data-i18n="nextArrow">→</button>
        </div>
      </div>
      <div class="row intro-buttons">
        <button type="button" class="btn" id="examplesNext" data-i18n="examplesNext">Empezar a practicar →</button>
      </div>
    </section>

    <!-- Pantalla 3: la hoja de prueba. app.js pinta una tarjeta por
         pregunta; al final se pulsa "Comprobar" y se verifican todas. -->
    <section id="screenGame" class="hidden stack">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-text" id="progressText">0 / 6</span>
      </div>

      <div class="stack test-sheet" id="testSheet" aria-live="polite"></div>

      <div class="row sheet-actions">
        <button type="button" class="btn" id="btnCheck" data-i18n="check">Comprobar</button>
        <button type="button" class="btn hidden" id="btnNewRound" data-i18n="newRound">Otra ronda →</button>
      </div>
    </section>

    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js?v=calculia-v4a0c88f5"></script>
  <script src="../../assets/js/i18n.js?v=calculia-v612d54ba"></script>
  <script src="../../assets/js/storage.js?v=calculia-vaa34f830"></script>
  <script src="../../assets/js/feedback.js?v=calculia-vd06b628a"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="../../assets/js/sw-register.js?v=calculia-v4a242865"></script>
</body>
</html>
