<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculia</title>
    <link rel="stylesheet" href="../../assets/css/brand.css">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/locale-picker.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div data-suite-header data-suite-logo="../../assets/img/icono.svg" data-suite-byline></div>
    <div class="suite-chrome-activity" data-suite-activity>
      <a href="../../" class="back-link" data-i18n="core.back">Menú de Teclatlon</a>
      <h1 data-i18n="title">🧠 Cálculo de cabeza</h1>
    </div>
    <p class="stars" data-suite-stars id="stars">0 ⭐</p>


    <main class="suite-body">
      <!-- Choose operation -->
      <section id="screenMenu" class="stack" aria-labelledby="menuTitle">
        <div class="row center-row">
          <p class="instruction" id="instruction" data-i18n="instruction">Cuenta de cabeza, llega a 10 primero o reparte entre 10 con puntos de colores.</p>
        </div>
        <div class="row center-row">
          <p class="instruction" id="menuTitle" data-i18n="chooseOperation">Elige qué quieres practicar</p>
        </div>
        <div class="menu-grid" id="operationGrid"></div>
      </section>

      <!-- Choose step size (count in your head only) -->
      <section id="screenLevels" class="stack hidden" aria-labelledby="levelsTitle">
        <h2 id="levelsTitle" data-i18n="chooseLevel">Elige un paso.</h2>
        <div class="menu-grid" id="levelGrid"></div>
      </section>

      <!-- Practice quiz -->
      <section id="screenQuiz" class="stack hidden" aria-live="polite">
        <div class="progress-bar" data-suite-progress>
          <div class="progress-fill" id="progressFill"></div>
          <span class="progress-text" id="progressText">0 / 10</span>
        </div>
        <article class="card act-card--task stack">
          <h2 class="equation" id="quizPrompt"></h2>
          <div class="visual-card" id="quizVisual" role="img"></div>
          <div class="option-row" id="options"></div>
          <p class="feedback" id="feedback" aria-live="polite"></p>
          <p class="explanation hidden" id="explanation" aria-live="polite"></p>
          <button type="button" class="btn hidden" id="nextFact" data-i18n="core.next">Siguiente →</button>
        </article>
      </section>

      <!-- Round finished -->
    </main>
    <footer data-suite-footer data-suite-base="../../"></footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/achievements-engine.js"></script>
  <script src="../../assets/js/achievements.js"></script>
  <script src="../../assets/js/stars-engine.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="../../assets/js/suite-chrome.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="../../assets/js/activity-glue.js"></script>
  <script src="app.js"></script>
  <script src="../../assets/js/sw-register.js"></script>
  <script src="../../assets/js/locale-picker-config.js"></script>
  <script src="../../assets/js/locale-picker.js" defer></script>
</body>
</html>
