<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculia</title>
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=calculia-v33a007d2">
  <link rel="stylesheet" href="../../assets/css/base.css?v=calculia-v89f2211a">
  <link rel="stylesheet" href="../../assets/css/components.css?v=calculia-v762b27b7">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <a href="../../" class="back-link" data-i18n="core.back">← Volver</a>
    <header class="tool-header centered">
      <h1 data-i18n="title">🧠 Cálculo de cabeza</h1>
      <p id="instruction" data-i18n="instruction">Cuenta de cabeza, llega a 10 primero o reparte entre 10 con puntos de colores.</p>
      <p class="stars" id="stars">⭐ 0</p>
    </header>

    <main>
      <!-- Choose operation -->
      <section id="screenMenu" class="stack" aria-labelledby="menuTitle">
        <h2 id="menuTitle" data-i18n="chooseOperation">Elige qué quieres practicar.</h2>
        <div class="menu-grid" id="operationGrid"></div>
      </section>

      <!-- Choose step size (count in your head only) -->
      <section id="screenLevels" class="stack hidden" aria-labelledby="levelsTitle">
        <h2 id="levelsTitle" data-i18n="chooseLevel">Elige un paso.</h2>
        <div class="menu-grid" id="levelGrid"></div>
      </section>

      <!-- Practice quiz -->
      <section id="screenQuiz" class="stack hidden" aria-live="polite">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
          <span class="progress-text" id="progressText">0 / 10</span>
        </div>
        <article class="card task-card stack">
          <h2 class="equation" id="quizPrompt"></h2>
          <div class="visual-card" id="quizVisual" role="img"></div>
          <div class="option-row" id="options"></div>
          <p class="feedback" id="feedback" aria-live="polite"></p>
          <p class="explanation hidden" id="explanation" aria-live="polite"></p>
          <button type="button" class="btn hidden" id="nextFact" data-i18n="core.next">Siguiente →</button>
        </article>
      </section>

      <!-- Round finished -->
      <section id="screenFinish" class="stack hidden centered">
        <div class="emoji-large" aria-hidden="true">🎉</div>
        <h2 data-i18n="core.roundComplete">¡Ronda completada!</h2>
        <p id="finishText"></p>
        <p id="transfer" class="transfer" data-i18n="transfer"></p>
      <button type="button" class="btn" id="endBackToStart" data-i18n="btnMenu">Volver al inicio</button>
    </section>
    </main>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js?v=calculia-v316dc766"></script>
  <script src="../../assets/js/i18n.js?v=calculia-vdc480eb5"></script>
  <script src="../../assets/js/storage.js?v=calculia-v31e9f33b"></script>
  <script src="../../assets/js/achievements.js?v=calculia-v1dcd53fb"></script>
  <script src="../../assets/js/feedback.js?v=calculia-v08363821"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="../../assets/js/sw-register.js?v=calculia-v4a242865"></script>
</body>
</html>
