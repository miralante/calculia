<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Numbers | Calculia</title>
  <meta name="theme-color" content="#FAF7F2">
    <link rel="stylesheet" href="../../assets/css/brand.css">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/locale-picker.css">
  <link rel="stylesheet" href="../../assets/css/place-value.css">
  <link rel="stylesheet" href="../../assets/css/expo-screens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div data-suite-header data-suite-logo="../../assets/img/icono.svg" data-suite-byline></div>
    <div class="suite-chrome-activity" data-suite-activity>
      <a href="../numbers-group/" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🧮 Los Números</h1>
    </div>
    <main class="suite-body">
    <span class="stars" data-suite-stars id="stars">⭐ 0</span>

    <section id="screenMenu" class="stack">
      <div class="row center-row">
        <p class="instruction" id="instruction" data-i18n="instructionMenu">Elige qué quieres practicar</p>
      </div>
      <div id="activitiesMenu"></div>
      <p class="extra-note" id="noteExtra"></p>
    </section>

    <!-- Exposition + real-life example screens for the sub-activities
         (ordinales, comparar, recta, unidades). One pair of
         sections, content painted dynamically from strings keyed by the
         current sub-activity id. After the real-life screen, "Empezar a
         practicar" leads into the existing game/free-exploration UI. -->
    <section id="expoScreen" class="hidden stack" aria-labelledby="expoTitleEl">
      <div class="row center-row">
        <p class="instruction" id="expoInstructionEl" data-i18n="instructionMenu"></p>
      </div>
      <div class="card centered stack expo-lesson-card">
        <h2 id="expoTitleEl"></h2>
        <div class="expo-lesson">
          <p id="expoIntroEl"></p>
          <ul id="expoBulletsEl"></ul>
        </div>
        <p class="expo-note" id="expoNoteEl"></p>
      </div>
      <p class="instruction hidden" id="expoProgressEl" aria-live="polite"></p>
      <div class="row lesson-actions">
        <button type="button" class="btn btn-secondary hidden" id="expoBack" data-i18n="expoBack"></button>
        <button type="button" class="btn" id="expoNext" data-i18n="expoNext"></button>
      </div>
    </section>

    <section id="realScreen" class="hidden stack" aria-labelledby="realTitleEl">
      <div class="row center-row">
        <p class="instruction" id="realInstructionEl" data-i18n="instructionMenu"></p>
      </div>
      <div class="card centered stack expo-lesson-card">
        <h2 id="realTitleEl"></h2>
        <div class="real-list" id="realListEl"></div>
      </div>
      <div class="row lesson-actions">
        <button type="button" class="btn btn-secondary" id="realBack" data-i18n="realBack"></button>
        <button type="button" class="btn" id="realNext" data-i18n="realNext"></button>
      </div>
    </section>

    

    <section id="screenGame" class="hidden stack">
      <div class="progress-bar" data-suite-progress id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-text" id="progressText">0 / 6</span>
        <span class="difficulty" id="difficulty"></span>
      </div>

      <div class="card centered stack" id="quizCard">
        <p class="prompt" id="prompt"></p>
        <div class="visual" id="visual"></div>
        <p class="legend hidden" id="legend"></p>
      </div>

      <div class="stack options" id="options"></div>

      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="row explanation hidden" id="explanationWrap">
        <p id="explanation" aria-live="polite"></p>
      </div>
      <button type="button" class="btn hidden" id="btnNext" data-i18n="core.next">Siguiente →</button>

      <!-- Interactive "leer números" level (data.js: 'lecturaInput').
           Shown only when level.tipo === 'lecturaInput'. The quiz card,
           options and standard #btnNext are hidden by app.js in this
           mode; this panel owns the surface. The number in words is
           painted into #lecturaWords when the user clicks
           #lecturaGenerate, the user types the numeric form into
           #lecturaInput, then either #lecturaCheck or #lecturaReveal
           advances the round. #lecturaHint nudges the user to click
           "Generar" first. -->
      <div id="lecturaUI" class="hidden stack">
        <div class="card centered stack lectura-card">
          <p class="lectura-words hidden" id="lecturaWords" aria-live="polite"></p>
          <p class="lectura-hint" id="lecturaHint"></p>
          <input type="text"
                 id="lecturaInput"
                 class="answer-input lectura-input hidden"
                 inputmode="numeric"
                 autocomplete="off"
                 autocapitalize="off"
                 autocorrect="off"
                 spellcheck="false"
                 maxlength="20"
                 aria-label="Escribe el número">
          <div class="lectura-actions">
            <button type="button" class="btn lectura-btn-generate" id="lecturaGenerate">🎲 Generar número</button>
            <button type="button" class="btn hidden" id="lecturaCheck">✅ Comprobar</button>
            <button type="button" class="btn btn-secondary hidden" id="lecturaReveal">👁 Ver resultado</button>
            <button type="button" class="btn hidden" id="lecturaNext">Siguiente →</button>
          </div>
        </div>
      </div>

      <!-- Interactive "escribir números" level (data.js: 'escribirInput').
           Sibling of #lecturaUI with the same shape (Generar / input /
           Comprobar / Ver resultado / Siguiente) but NO visual number:
           "Generar" plays the number aloud via Web Speech, and a
           "🔊 Reproducir" button replays the same audio so the user
           can hear it again before answering. "Ver resultado" reveals
           the digits by filling the input, just like #lecturaUI. The
           quiz card and standard #btnNext are hidden by app.js in
           this mode. -->
      <div id="escribirUI" class="hidden stack">
        <div class="card centered stack lectura-card">
          <p class="lectura-words hidden" id="escribirNumber" aria-live="polite"></p>
          <p class="lectura-hint" id="escribirHint"></p>
          <input type="text"
                 id="escribirInput"
                 class="answer-input lectura-input hidden"
                 inputmode="numeric"
                 autocomplete="off"
                 autocapitalize="off"
                 autocorrect="off"
                 spellcheck="false"
                 maxlength="20"
                 aria-label="Escribe el número que has oído">
          <div class="lectura-actions">
            <button type="button" class="btn lectura-btn-generate" id="escribirGenerate">🎲 Generar número</button>
            <button type="button" class="btn btn-secondary hidden" id="escribirReplay">🔊 Reproducir</button>
            <button type="button" class="btn hidden" id="escribirCheck">✅ Comprobar</button>
            <button type="button" class="btn btn-secondary hidden" id="escribirReveal">👁 Ver resultado</button>
            <button type="button" class="btn hidden" id="escribirNext">Siguiente →</button>
          </div>
        </div>
      </div>

      <!-- Free-exploration counter level. Shown only when level.tipo === 'counter'.
           The quiz card, progress bar, options and feedback are hidden by app.js
           in this mode. No question is asked; the person moves the number with
           the buttons and exits when ready (+1 star). -->
      <div id="counterUI" class="hidden stack">
        <div class="card centered counter-card">
          <div id="counterNumber" class="counter-number" aria-live="polite"></div>
        </div>
        <div class="counter-controls">
          <div class="counter-row">
            <button type="button" class="btn-counter" data-step="-1000">−1000</button>
            <button type="button" class="btn-counter" data-step="-100">−100</button>
            <button type="button" class="btn-counter" data-step="-10">−10</button>
            <button type="button" class="btn-counter" data-step="-1">−1</button>
            <button type="button" class="btn-counter btn-counter-icon" id="counterAudio" aria-label="Read the number aloud">🔊</button>
            <button type="button" class="btn-counter btn-secondary" id="counterReset">🔄 Start at 0</button>
          </div>
          <div class="counter-row">
            <button type="button" class="btn-counter" data-step="1">+1</button>
            <button type="button" class="btn-counter" data-step="10">+10</button>
            <button type="button" class="btn-counter" data-step="100">+100</button>
            <button type="button" class="btn-counter" data-step="1000">+1000</button>
            <button type="button" class="btn-counter btn-secondary" id="counterSep"><span id="counterSepLabel">,1,234</span></button>
            <button type="button" class="btn-counter btn-secondary hidden" id="counterGroups"><span id="counterGroupsLabel">🎨 Colour groups</span></button>
            <button type="button" class="btn-counter btn-secondary" id="counterWords" aria-pressed="false"><span id="counterWordsLabel">✍️ Show number in words</span></button>
            <button type="button" class="btn-counter" id="counterExit">✅ Exit</button>
          </div>
        </div>
        <p class="counter-written hidden" id="counterWritten" aria-live="polite"></p>
        <p class="instruction counter-hint" id="counterHint" data-i18n="gen.counterHint"></p>
      </div>
    </section>

    </main>
    <footer data-suite-footer data-suite-base="../../" data-suite-settings></footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/achievements-engine.js"></script>
  <script src="../../assets/js/achievements.js"></script>
  <script src="../../assets/js/stars-engine.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="../../assets/js/tts.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="../../assets/js/place-value.js"></script>
  <script src="model.js"></script>
  <script src="../../assets/js/expo-screens.js"></script>
  <script src="counter.js"></script>
  <script src="typing.js"></script>
  <script src="../../assets/js/activity-glue.js"></script>
  <script src="../../assets/js/classic-quiz.js"></script>
  <script src="app.js"></script>
  <script src="../../assets/js/sw-register.js"></script>
  <script src="../../assets/js/locale-picker-config.js"></script>
  <script src="../../assets/js/locale-picker.js" defer></script>
  <script src="../../assets/js/suite-chrome.js"></script>
</body>
</html>
