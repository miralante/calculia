<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Numbers | Calculia</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🧮 Los Números</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <section id="screenMenu" class="stack">
      <div class="row center-row">
        <p class="instruction" id="instruction" data-i18n="instructionMenu">Elige una actividad.</p>
      </div>
      <div id="activitiesMenu"></div>
      <p class="extra-note" id="noteExtra"></p>
    </section>

    <section id="screenLevels" class="hidden stack">
      <h2 id="activityTitle"></h2>
      <div class="row center-row">
        <p class="instruction" id="activityInstruction"></p>
      </div>
      <div class="stack" id="levels"></div>
      <button type="button" class="btn btn-secondary" id="btnBackToMenu" data-i18n="btnBackToMenu">← Otras actividades</button>
    </section>

    <section id="screenGame" class="hidden stack">
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-text" id="progressText">0 / 6</span>
      </div>

      <div class="card centered stack" id="quizCard">
        <p class="prompt" id="prompt"></p>
        <div class="visual" id="visual"></div>
        <p class="legend hidden" id="legend"></p>
      </div>

      <div class="stack options" id="options"></div>

      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="row explanation hidden" id="explanationWrap">
        <p id="explanation" aria-live="polite"></p>
      </div>
      <button type="button" class="btn hidden" id="btnNext" data-i18n="core.next">Siguiente →</button>

      <!-- Free-exploration counter level. Shown only when level.tipo === 'counter'.
           The quiz card, progress bar, options and feedback are hidden by app.js
           in this mode. No question is asked; the person moves the number with
           the buttons and exits when ready (+1 star). -->
      <div id="counterUI" class="hidden stack">
        <div class="card centered counter-card">
          <div id="counterNumber" class="counter-number" aria-live="polite"></div>
        </div>
        <div class="counter-controls">
          <div class="counter-row">
            <button type="button" class="btn-counter" data-step="-1000">−1000</button>
            <button type="button" class="btn-counter" data-step="-100">−100</button>
            <button type="button" class="btn-counter" data-step="-10">−10</button>
            <button type="button" class="btn-counter" data-step="-1">−1</button>
            <button type="button" class="btn-counter btn-counter-icon" id="counterAudio" aria-label="Read the number aloud">🔊</button>
            <button type="button" class="btn-counter btn-secondary" id="counterReset">🔄 Start at 0</button>
          </div>
          <div class="counter-row">
            <button type="button" class="btn-counter" data-step="1">+1</button>
            <button type="button" class="btn-counter" data-step="10">+10</button>
            <button type="button" class="btn-counter" data-step="100">+100</button>
            <button type="button" class="btn-counter" data-step="1000">+1000</button>
            <button type="button" class="btn-counter btn-secondary" id="counterSep"><span id="counterSepLabel">,1,234</span></button>
            <button type="button" class="btn-counter btn-secondary hidden" id="counterGroups"><span id="counterGroupsLabel">🎨 Colour groups</span></button>
            <button type="button" class="btn-counter btn-secondary" id="counterWords" aria-pressed="false"><span id="counterWordsLabel">✍️ Show number in words</span></button>
            <button type="button" class="btn-counter" id="counterExit">✅ Exit</button>
          </div>
        </div>
        <p class="counter-written hidden" id="counterWritten" aria-live="polite"></p>
        <p class="instruction counter-hint" id="counterHint" data-i18n="gen.counterHint"></p>
      </div>

      <!-- Free-exploration elevator ('positivos-y-negativos'). Shown only
           when level.tipo is 'ascensorLibre' or 'ascensorMeta'. Same
           mechanic as the water-temperature tool: −10/−1/+1/+10
           buttons, the visual reacts on every step (the elevator emoji
           moves up and down the shaft), the floor number reads aloud
           with the matching sign. No quiz, no wrong-answer feedback;
           for 'ascensorMeta' a celebration message appears once the
           target floor is reached. The shaft is decorative
           (aria-hidden); the accessible reading lives in the live
           region #elevatorNumber. -->
      <div id="elevatorUI" class="hidden stack">
        <div class="card centered elevator-card">
          <p class="elevator-goal" id="elevatorGoal"></p>
          <div class="elevator-visual">
            <div id="elevatorShaft" class="elevator-shaft-dynamic" aria-hidden="true"></div>
            <div id="elevatorNumber" class="elevator-number" aria-live="polite"></div>
            <p class="elevator-state-label" id="elevatorStateLabel"></p>
          </div>
        </div>
        <!-- Random exploration suggestion. Same pattern as the
             temperature tool: a starting idea the user can ignore
             or take. For 'ascensorMeta' the goal line above names
             the target, so the random suggestion is hidden to
             avoid sending contradictory directions. For
             'ascensorLibre' it adds a concrete starting floor to
             the open-ended mission. -->
        <p class="elevator-suggestion hidden" id="elevatorSuggestion" aria-live="polite"></p>
        <div class="elevator-controls">
          <div class="elevator-row">
            <button type="button" class="btn-elevator" data-step="-10">−10</button>
            <button type="button" class="btn-elevator" data-step="-1">−1</button>
            <button type="button" class="btn-elevator btn-elevator-icon" id="elevatorAudio" aria-label="Hear the floor">🔊</button>
            <button type="button" class="btn-elevator btn-elevator-secondary" id="elevatorReset">🔄 Start at 0</button>
            <button type="button" class="btn-elevator" data-step="1">+1</button>
            <button type="button" class="btn-elevator" data-step="10">+10</button>
            <button type="button" class="btn-elevator" id="elevatorExit">✅ Exit</button>
          </div>
        </div>
        <p class="instruction elevator-hint" id="elevatorHint" data-i18n="gen.elevatorHint"></p>
      </div>
    </section>

    <section id="screenEnd" class="hidden centered stack" aria-live="polite">
      <div class="emoji-large" aria-hidden="true">🎉</div>
      <h2 data-i18n="core.roundComplete">¡Ronda completada!</h2>
      <p id="endSummary"></p>
      <p id="transfer" class="transfer" data-i18n="transferencia"></p>
      <button type="button" class="btn btn-secondary hidden" id="btnHarder"></button>
      <button type="button" class="btn" id="btnRepeat" data-i18n="core.playAgain">Jugar otra vez</button>
      <button type="button" class="btn btn-secondary" id="btnOtherLevel" data-i18n="otherLevel">Elegir otro paso</button>
      <button type="button" class="btn btn-secondary" id="btnOtherActivity" data-i18n="btnOtherActivity">Otra actividad</button>
      <a href="../../site/index.html" class="btn btn-secondary" data-i18n="core.backToMenu">Volver al menú</a>
    </section>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="../../assets/js/sw-register.js"></script>
</body>
</html>
