<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fractions | Calculia</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=calculia-v33a007d2">
  <link rel="stylesheet" href="../../assets/css/base.css?v=calculia-v89f2211a">
  <link rel="stylesheet" href="../../assets/css/components.css?v=calculia-v62e5b2c5">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🍕 Fracciones</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <section id="screenMenu" class="stack">
      <div class="row center-row">
        <p class="instruction" id="instruction" data-i18n="instructionMenu">Elige una actividad.</p>
      </div>
      <div id="activitiesMenu"></div>
    </section>

    

    <!-- Explanation before the first round: what a fraction is, in three slides. -->
    <section id="screenIntro" class="hidden stack">
      <div class="row center-row">
        <p class="instruction" id="introInstruction">Antes de jugar, mira cómo se lee una fracción.</p>
      </div>
      <div class="card reference-card stack">
        <h2 class="reference-title" id="introTitle">Qué es una fracción</h2>
        <p class="reference-text" id="introText">Una fracción dice qué parte de algo tomas. Se escribe con dos números, uno encima del otro.</p>
      </div>
      <div class="card stack carousel-card">
        <div class="intro-visual" id="introVisual"></div>
        <p class="carousel-caption" id="introCaption"></p>
        <div class="carousel-controls">
          <button type="button" class="btn btn-secondary" id="introPrev">←</button>
          <button type="button" class="btn btn-secondary" id="introNext">→</button>
        </div>
      </div>
      <div class="row intro-buttons">
        <button type="button" class="btn btn-secondary" id="introReal">Verlo en la vida real →</button>
      </div>
    </section>

    <!-- Real-life examples, shown before the first round. -->
    <section id="screenReal" class="hidden stack">
      <div class="row center-row">
        <p class="instruction" id="realTitle">Las fracciones están en la vida real.</p>
      </div>
      <div class="card centered stack real-card">
        <div class="real-object" id="realObject" aria-hidden="true"></div>
        <p class="carousel-caption" id="realCaption"></p>
        <div class="carousel-controls">
          <button type="button" class="btn btn-secondary" id="realPrev">←</button>
          <button type="button" class="btn btn-secondary" id="realNext">→</button>
        </div>
      </div>
      <div class="row intro-buttons">
        <button type="button" class="btn" id="realContinue">Empezar a practicar →</button>
      </div>
    </section>

    <section id="screenGame" class="hidden stack">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-text" id="progressText">0 / 6</span>
        <span class="difficulty" id="difficulty"></span>
      </div>

      <div class="card centered stack">
        <p class="prompt" id="prompt"></p>
        <div class="visual" id="visual"></div>
        <p class="legend hidden" id="legend"></p>
      </div>

      <div class="stack options" id="options"></div>

      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="row explanation hidden" id="explanationWrap">
        <p id="explanation" aria-live="polite"></p>
      </div>
      <button type="button" class="btn hidden" id="btnNext" data-i18n="core.next">Siguiente →</button>
    </section>

    <!-- Poner la coma decimal (actividad 'coma'): el número sin separadores,
         con un hueco entre cada cifra. #commaBoard son las cifras y los huecos
         (botones); #commaTray es la coma que todavía no tiene sitio. -->
    <section id="screenComma" class="hidden stack" aria-live="polite">
      <div class="progress-bar" aria-hidden="true"><div class="progress-fill" id="comaProgressFill"></div></div>
      <p class="progress-text" id="comaProgressText"></p>
      <article class="card task-card">
        <h2 id="comaPrompt"></h2>
        <p class="task-detail" id="comaDetail"></p>
        <button type="button" class="btn btn-secondary hidden" id="comaHear" data-i18n="core.listen">🔊 Escuchar</button>

        <div class="comma-zone">
          <div class="comma-row">
            <div class="comma-board" id="commaBoard" role="group" data-i18n-aria="coma.boardAria" aria-label="Número para colocar la coma decimal"></div>
            <div class="comma-tray" id="commaTray" aria-hidden="true"></div>
          </div>
        </div>

        <p class="feedback" id="comaFeedback" aria-live="polite"></p>
        <button type="button" class="btn" id="comaCheck" data-i18n="coma.check">Comprobar</button>
        <button type="button" class="btn hidden" id="comaNext" data-i18n="core.next">Siguiente →</button>
      </article>
      <button type="button" class="btn btn-secondary" id="comaBack" data-i18n="btnBackToMenu">← Otras actividades</button>
    </section>

    <section id="screenEnd" class="stack hidden centered">
      <div class="emoji-large" aria-hidden="true">🎉</div>
      <h2 data-i18n="core.roundComplete">¡Ronda completada!</h2>
      <p id="endSummary"></p>
      <p id="transfer" class="transfer" data-i18n="transfer"></p>
      <button type="button" class="btn" id="endBackToStart" data-i18n="btnMenu">Volver al inicio</button>
    </section>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js?v=calculia-v37f362d0"></script>
  <script src="../../assets/js/i18n.js?v=calculia-v3d393c12"></script>
  <script src="../../assets/js/storage.js?v=calculia-vd97e2550"></script>
  <script src="../../assets/js/feedback.js?v=calculia-v73bb9e8a"></script>
  <script src="../../assets/js/tts.js?v=calculia-va9046a0d"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="../../assets/js/sw-register.js?v=calculia-v4a242865"></script>
</body>
</html>
