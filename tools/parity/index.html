<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Even and odd | Calculia</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=calculia-v33a007d2">
  <link rel="stylesheet" href="../../assets/css/base.css?v=calculia-v89f2211a">
  <link rel="stylesheet" href="../../assets/css/components.css?v=calculia-v62e5b2c5">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header centered">
      <a href="../../" class="back-link" data-i18n="core.back">← Volver</a>
      <h1 data-i18n="title">🟦 Pares e impares</h1>
      <div class="row center-row">
        <p class="instruction" id="instruction" data-i18n="instruction">Mira los puntos: ¿sobra uno o van todos en parejas?</p>
      </div>
      <p class="stars" id="stars">⭐ 0</p>
    </header>

    <main>
      <!-- Pantalla de juego: el número se pinta como una columna de
           puntos. Una pareja vale "par"; si sobra un punto solo, es
           impar. El punto sobrado va en otro color para que se vea. -->
      <section id="screenParity" class="stack">
        <div class="row">
          <button type="button" class="btn btn-secondary" id="parityBack" data-i18n="btnMenu">Volver al inicio</button>
        </div>
        <div class="progress-bar" aria-hidden="true">
          <div class="progress-fill" id="parityProgressFill"></div>
        </div>
        <p class="progress-text" id="parityProgressText"></p>
        <article class="card stack parity-card">
          <h2 id="parityPrompt"></h2>
          <div class="parity-dots" id="parityDots" role="img"></div>
          <div class="parity-options" id="parityOptions" aria-label="Opciones"></div>
          <p class="feedback" id="parityFeedback" aria-live="polite"></p>
          <div class="explanation hidden" id="parityExplanationWrap">
            <p id="parityExplanation" aria-live="polite"></p>
          </div>
          <button type="button" class="btn hidden" id="parityNext" data-i18n="core.next">Siguiente →</button>
        </article>
      </section>

      <section id="screenParityFinish" class="stack hidden centered">
        <div class="big-emoji" aria-hidden="true">🎉</div>
        <h2 data-i18n="core.roundComplete">¡Ronda terminada!</h2>
        <p id="parityFinalSummary"></p>
        <p class="transfer" data-i18n="parityTransfer"></p>
      <button type="button" class="btn" id="endBackToStart" data-i18n="btnMenu">Volver al inicio</button>
    </section>
    </main>

    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js?v=calculia-v37f362d0"></script>
  <script src="../../assets/js/i18n.js?v=calculia-v3d393c12"></script>
  <script src="../../assets/js/storage.js?v=calculia-vd97e2550"></script>
  <script src="../../assets/js/feedback.js?v=calculia-v73bb9e8a"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="../../assets/js/sw-register.js?v=calculia-v4a242865"></script>
</body>
</html>
