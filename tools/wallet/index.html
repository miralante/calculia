<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Wallet | Calculia</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../site/index.html" class="back-link" data-i18n="core.back">← Back</a>
      <h1 data-i18n="title">💶 The Wallet</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Screen: 5-activity menu -->
    <section id="screenMenu" class="stack">
      <div class="row center-row">
        <p class="instruction" id="instruction" data-i18n="instruction">Here you practise real money: counting it, paying, checking the change and saving.</p>
      </div>
      <div class="card-grid">
        <button type="button" class="activity-card" data-activity="count">
          <span class="picto" aria-hidden="true">🪙</span>
          <span class="name" data-i18n="menuCount">How much is there?</span>
          <span class="detail" data-i18n="menuCountDetail">Look at the money and choose the total.</span>
        </button>
        <button type="button" class="activity-card" data-activity="pay">
          <span class="picto" aria-hidden="true">🛒</span>
          <span class="name" data-i18n="menuPay">Pay the exact price</span>
          <span class="detail" data-i18n="menuPayDetail">Touch the money up to the exact price.</span>
        </button>
        <button type="button" class="activity-card" data-activity="payWith">
          <span class="picto" aria-hidden="true">💵</span>
          <span class="name" data-i18n="menuPayWith">What do I pay with?</span>
          <span class="detail" data-i18n="menuPayWithDetail">Choose the money that is enough.</span>
        </button>
        <button type="button" class="activity-card" data-activity="change">
          <span class="picto" aria-hidden="true">🔍</span>
          <span class="name" data-i18n="menuCheckChange">Is the change right?</span>
          <span class="detail" data-i18n="menuCheckChangeDetail">Count the change and decide.</span>
        </button>
        <button type="button" class="activity-card" data-activity="piggyBank">
          <span class="picto" aria-hidden="true">🐷</span>
          <span class="name" data-i18n="menuPiggyBank">The Piggy Bank</span>
          <span class="detail" data-i18n="menuPiggyBankDetail">How much is missing to buy it?</span>
        </button>
        <button type="button" class="activity-card" data-activity="rounding">
          <span class="picto" aria-hidden="true">🎯</span>
          <span class="name" data-i18n="menuRounding">More or less</span>
          <span class="detail" data-i18n="menuRoundingDetail">How much is it, without counting cents?</span>
        </button>
      </div>
    </section>

    <!-- Levels screen (shared by every activity) -->
    <section id="screenLevels" class="hidden stack centered">
      <div class="row"><button type="button" class="btn btn-secondary" id="btnBackToMenuLevels" data-i18n="backToMenu">← Menu</button></div>
      <div class="row center-row">
        <p class="instruction" id="activityInstruction"></p>
      </div>
      <h2 data-i18n="chooseLevel">Choose a step</h2>
      <div class="stack" id="levels"></div>
    </section>

    <!-- Quiz game screen (shared: count, payWith, change, piggyBank) -->
    <section id="screenQuizGame" class="hidden stack">
      <div class="progress-bar">
        <div class="progress-fill" id="progressQuizFill"></div>
        <span class="progress-text" id="progressQuizText">0 / 6</span>
      </div>

      <div class="row center-row">
        <p class="prompt" id="quizPrompt"></p>
      </div>

      <div class="money-table hidden" id="moneyTable" role="group" data-i18n-aria="tableAria" aria-label="Money on the table"></div>

      <div class="options stack" id="quizOptions"></div>

      <div class="feedback" id="quizFeedback" aria-live="polite"></div>
      <div class="row explanation hidden" id="quizExplanationWrap">
        <p id="quizExplanation" aria-live="polite"></p>
      </div>
      <button type="button" class="btn hidden" id="btnNextQuiz" data-i18n="core.next">Next →</button>
    </section>

    <!-- Pay-exactly game screen (interactive, its own) -->
    <section id="screenPayGame" class="hidden stack">
      <div class="progress-bar">
        <div class="progress-fill" id="progressPayFill"></div>
        <span class="progress-text" id="progressPayText">0 / 6</span>
      </div>

      <div class="card centered stack">
        <div class="product" id="product"></div>
        <p class="price" id="priceText"></p>
      </div>

      <div class="row center-row">
        <p class="total" id="totalPlaced" aria-live="polite">You have put in: 0,00 €</p>
        <button type="button" class="btn btn-secondary" id="btnPayHint" data-i18n="btnHint">💡 Help</button>
      </div>

      <div class="stack-monedas" id="money"></div>

      <div class="row center-row acciones">
        <button type="button" class="btn btn-secondary" id="btnRemoveLast" data-i18n="removeLast">↩ Remove last</button>
        <button type="button" class="btn btn-secondary" id="btnClear" data-i18n="clear">🗑 Empty</button>
        <button type="button" class="btn" id="btnCheck" data-i18n="check">Check</button>
      </div>

      <div class="row explanation hidden" id="payHintWrap">
        <p id="payHintText" aria-live="polite"></p>
        <button type="button" class="btn btn-audio" id="btnListenPayHint" data-i18n-aria="listenHintAria" aria-label="Listen to the help">🔊</button>
      </div>

      <div class="feedback" id="payFeedback" aria-live="polite"></div>
      <button type="button" class="btn hidden" id="btnNextPay" data-i18n="core.next">Next →</button>
    </section>

    <!-- End screen (shared by every activity) -->
    <section id="screenEnd" class="hidden centered stack" aria-live="polite">
      <div class="emoji-large" aria-hidden="true">🎉</div>
      <h2 data-i18n="core.roundComplete">Round complete!</h2>
      <p id="endSummary"></p>
      <p id="transfer" class="transfer" data-i18n="transfer"></p>
      <button type="button" class="btn" id="btnRepeat" data-i18n="core.playAgain">Play again</button>
      <button type="button" class="btn btn-secondary" id="btnAnotherLevelEnd" data-i18n="btnAnotherLevel">Choose another step</button>
      <button type="button" class="btn btn-secondary" id="btnBackToMenuEnd" data-i18n="backToMenu">← Menu</button>
    </section>
    <footer class="pie-app">
      <a href="../../legal/index.html" class="legal-link" data-i18n="core.dataProtection">Data protection</a>
    </footer>
  </div>

  <script src="../../assets/js/utils.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/tts.js"></script>
  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/feedback.js"></script>
  <script src="../../assets/js/dinero.js"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="../../assets/js/sw-register.js"></script>
</body>
</html>
