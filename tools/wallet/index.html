<!DOCTYPE html>
<html lang="es" data-i18n-title="title">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Wallet | Calculia</title>
  <meta name="theme-color" content="#FAF7F2">
  <link rel="stylesheet" href="../../assets/css/tokens.css?v=calculia-v33a007d2">
  <link rel="stylesheet" href="../../assets/css/base.css?v=calculia-v89f2211a">
  <link rel="stylesheet" href="../../assets/css/components.css?v=calculia-v762b27b7">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="tool-header">
      <a href="../../" class="back-link" data-i18n="core.back">← Back</a>
      <h1 data-i18n="title">💶 The Wallet</h1>
      <span class="stars" id="stars">⭐ 0</span>
    </header>

    <!-- Screen: 5-activity menu -->
    <section id="screenMenu" class="stack">
      <div class="row center-row">
        <p class="instruction" id="instruction" data-i18n="instruction">Here you practise real money: counting it, paying, checking the change and saving.</p>
      </div>
      <div class="menu-grid">
        <button type="button" class="btn-actividad" data-activity="count">
          <span class="picto" aria-hidden="true">💰</span>
          <span data-i18n="menuCount">How much is there?</span>
          <span class="detail-card" data-i18n="menuCountDetail">Look at the money and choose the total.</span>
        </button>
        <button type="button" class="btn-actividad" data-activity="pay">
          <span class="picto" aria-hidden="true">🛒</span>
          <span data-i18n="menuPay">Pay the exact price</span>
          <span class="detail-card" data-i18n="menuPayDetail">Touch the money up to the exact price.</span>
        </button>
        <button type="button" class="btn-actividad" data-activity="payWith">
          <span class="picto" aria-hidden="true">💵</span>
          <span data-i18n="menuPayWith">What do I pay with?</span>
          <span class="detail-card" data-i18n="menuPayWithDetail">Choose the money that is enough.</span>
        </button>
        <button type="button" class="btn-actividad" data-activity="change">
          <span class="picto" aria-hidden="true">🔍</span>
          <span data-i18n="menuCheckChange">Is the change right?</span>
          <span class="detail-card" data-i18n="menuCheckChangeDetail">Count the change and decide.</span>
        </button>
        <button type="button" class="btn-actividad" data-activity="piggyBank">
          <span class="picto" aria-hidden="true">🐷</span>
          <span data-i18n="menuPiggyBank">The Piggy Bank</span>
          <span class="detail-card" data-i18n="menuPiggyBankDetail">How much is missing to buy it?</span>
        </button>
        <button type="button" class="btn-actividad" data-activity="rounding">
          <span class="picto" aria-hidden="true">🎯</span>
          <span data-i18n="menuRounding">More or less</span>
          <span class="detail-card" data-i18n="menuRoundingDetail">How much is it, without counting cents?</span>
        </button>
      </div>
    </section>

    <!-- Levels screen (shared by every activity) -->
    

    <!-- Quiz game screen (shared: count, payWith, change, piggyBank) -->
    <section id="screenQuizGame" class="hidden stack">
      <div class="progress-bar">
        <div class="progress-fill" id="progressQuizFill"></div>
        <span class="progress-text" id="progressQuizText">0 / 6</span>
        <span class="difficulty" id="difficulty"></span>
      </div>

      <div class="row center-row">
        <p class="prompt" id="quizPrompt"></p>
      </div>

      <div class="money-table hidden" id="moneyTable" role="group" data-i18n-aria="tableAria" aria-label="Money on the table"></div>

      <div class="options stack" id="quizOptions"></div>

      <div class="feedback" id="quizFeedback" aria-live="polite"></div>
      <div class="row explanation hidden" id="quizExplanationWrap">
        <p id="quizExplanation" aria-live="polite"></p>
      </div>
      <button type="button" class="btn hidden" id="btnNextQuiz" data-i18n="core.next">Next →</button>
    </section>

    <!-- Pay-exactly game screen (interactive, its own) -->
    <section id="screenPayGame" class="hidden stack">
      <div class="progress-bar">
        <div class="progress-fill" id="progressPayFill"></div>
        <span class="progress-text" id="progressPayText">0 / 6</span>
        <span class="difficulty" id="difficulty"></span>
      </div>

      <div class="card centered stack">
        <div class="product" id="product"></div>
        <p class="price" id="priceText"></p>
      </div>

      <div class="row center-row">
        <p class="total" id="totalPlaced" aria-live="polite">You have put in: 0,00 €</p>
        <button type="button" class="btn btn-secondary" id="btnPayHint" data-i18n="btnHint">💡 Help</button>
      </div>

      <div class="stack-monedas" id="money"></div>

      <div class="row center-row actions">
        <button type="button" class="btn btn-secondary" id="btnRemoveLast" data-i18n="removeLast">↩ Remove last</button>
        <button type="button" class="btn btn-secondary" id="btnClear" data-i18n="clear">🗑 Empty</button>
        <button type="button" class="btn" id="btnCheck" data-i18n="check">Check</button>
      </div>

      <div class="row explanation hidden" id="payHintWrap">
        <p id="payHintText" aria-live="polite"></p>      </div>

      <div class="feedback" id="payFeedback" aria-live="polite"></div>
      <button type="button" class="btn hidden" id="btnNextPay" data-i18n="core.next">Next →</button>
    </section>

    <!-- End screen (shared by every activity) -->
    <section id="screenEnd" class="stack hidden centered">
      <div class="emoji-large" aria-hidden="true">🎉</div>
      <h2 data-i18n="core.roundComplete">Round complete!</h2>
      <p id="endSummary"></p>
      <p id="contexto" class="contexto"></p>
      <p id="explanation" class="explanation"></p>
      <p id="transfer" class="transfer" data-i18n="transfer"></p>
      <button type="button" class="btn" id="endBackToStart" data-i18n="btnMenu">Volver al inicio</button>
    </section>
    <footer data-pie-app data-pie-base="../../" data-pie-class="pie-app"></footer>
  </div>

  <script src="../../assets/js/utils.js?v=calculia-v316dc766"></script>
  <script src="../../assets/js/i18n.js?v=calculia-vdc480eb5"></script>
  <script src="../../assets/js/storage.js?v=calculia-v31e9f33b"></script>
  <script src="../../assets/js/achievements.js?v=calculia-v1dcd53fb"></script>
  <script src="../../assets/js/feedback.js?v=calculia-v08363821"></script>
  <script src="../../assets/js/dinero.js?v=calculia-v41eaf77e"></script>
  <script src="strings.es.js"></script>
  <script src="strings.en.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="../../assets/js/sw-register.js?v=calculia-v4a242865"></script>
</body>
</html>
